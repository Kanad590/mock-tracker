<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E20" />
      <stop offset="45%" stop-color="#0F3D3E" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <radialGradient id="glossGrad" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0F3D3E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>

    <!-- Metallic Champagne Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#FCE182" />
    </linearGradient>

    <!-- Bullseye Radiant Red-Amber -->
    <radialGradient id="bullseyeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>

    <!-- Analytics Trend Glow -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Trend Area Fill -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F3D3E" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#glossGrad)" />
  <!-- Elegant Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" opacity="0.85" />

  <!-- Target Background Glow -->
  <circle cx="256" cy="256" r="168" fill="#0D3436" opacity="0.6" />

  <!-- Concentric Target Rings -->
  <!-- Ring 1 (Outer Rim) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45" stroke-dasharray="10 6" />

  <!-- Ring 2 (Middle Guard) -->
  <circle cx="256" cy="256" r="122" fill="#0F3D3E" fill-opacity="0.5" stroke="url(#goldGrad)" stroke-width="6.5" />

  <!-- Ring 3 (Inner Track) -->
  <circle cx="256" cy="256" r="82" fill="#134E4A" fill-opacity="0.75" stroke="#FAF8F4" stroke-width="4" opacity="0.9" />

  <!-- Ring 4 (Bullseye Center) -->
  <circle cx="256" cy="256" r="44" fill="url(#bullseyeGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="14" fill="#FFFBEB" opacity="0.95" />

  <!-- Precision Crosshair Reticle -->
  <line x1="68" y1="256" x2="132" y2="256" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="380" y1="256" x2="444" y2="256" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="256" y1="68" x2="256" y2="132" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="256" y1="380" x2="256" y2="444" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Reticle Cardinal Dots -->
  <circle cx="82" cy="256" r="4.5" fill="#FCD34D" />
  <circle cx="430" cy="256" r="4.5" fill="#FCD34D" />
  <circle cx="256" cy="82" r="4.5" fill="#FCD34D" />
  <circle cx="256" cy="430" r="4.5" fill="#FCD34D" />

  <!-- Analytics Growth Trend Area (Filled underneath) -->
  <path d="M 112 390 Q 185 385 220 325 T 325 240 T 408 128 L 408 390 Z" fill="url(#areaGrad)" />

  <!-- Dynamic Trend Curve (Score Rising to Victory) -->
  <path d="M 112 390 Q 185 385 220 325 T 325 240 T 408 128" fill="none" stroke="url(#trendGrad)" stroke-width="9.5" stroke-linecap="round" filter="url(#dropShadow)" />

  <!-- Trend Node Points -->
  <circle cx="112" cy="390" r="7.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="220" cy="325" r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="325" cy="240" r="8.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Victory Peak 4-Point Star (Aim Achieved / Cutoff Cracked) -->
  <g transform="translate(408, 128)" filter="url(#starGlow)">
    <path d="M 0 -32 Q 0 0 -32 0 Q 0 0 0 32 Q 0 0 32 0 Q 0 0 0 -32 Z" fill="url(#goldGrad)" stroke="#FFFBEB" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
</svg>