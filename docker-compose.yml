services:
  mock-tracker:
    image: saman514/mock-tracker:latest
    build: .
    container_name: mock-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-8856}:8856"
    volumes:
      - mock_tracker_data:/app/data
    environment:
      - PORT=8856
      # Optional: Kanboard Task & Syllabus Sync
      # - KANBOARD_URL=http://your-kanboard:80/jsonrpc.php
      # - KANBOARD_USER=ai
      # - KANBOARD_TOKEN=your_kanboard_api_token
      # - KANBOARD_PROJECT_ID=4
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mock_tracker_data:
    name: mock_tracker_data
